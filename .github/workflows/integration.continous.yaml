name: Compilation du projet atetlier-test-unitaire

# Le on specific moment d'execution
on:
  push:
  workflow_dispatch: #manuel
#Creation des jobs
jobs:
  compilation: # Nom du premier job qui s'execute sur un runner ubuntu
      runs-on: ubuntu-latest
      # Definitions des etapes du workflow
      steps:

        - name: checkout the repo
          uses: actions/checkout@v5

        - name: Set up JDK 25
          uses: actions/setup-java@v5
          with:
            java-version: '25'
            distribution: 'temurin'
        - name: Ajouter le droit
          run: chmod +x mvnw 
        - name: Compile le projet
          run: ./mvnw compile 
        - name: Build
          run: ./mvnw -B clean package -DskipTests 
        - name: Publier le .jar en artefact
          uses: actions/upload-artifact@v5
          with:
            name: application-jar
            path: target/*.jar    
